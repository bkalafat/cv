name: Build and Deploy CV

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install PDF dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate CV sources
        run: python scripts/validate_cv.py
      - name: Test pagination and Unicode
        run: python -m unittest discover -s tests -v
      - name: Generate both PDFs
        run: |
          python scripts/generate_beautiful_cv.py
          python scripts/generate_beautiful_cv_ats.py
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Validate generated website and PDFs
        run: python scripts/validate_cv.py --outputs
      - name: Upload CV PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            downloads/*.pdf
            downloads/*.txt
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
