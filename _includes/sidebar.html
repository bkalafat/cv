{% assign sidebar = site.data.data.sidebar %}
<header class="sidebar-wrapper">
  <div class="profile-container">
    {% if sidebar.avatar %}
    <img class="avatar" src="{{ '/assets/images/' | append: sidebar.avatar | relative_url }}" alt="Burak Kalafat" width="112" height="112">
    {% endif %}
    <h1 class="name">{{ sidebar.name | escape }}</h1>
    <p class="tagline">{{ sidebar.tagline | escape }}</p>
  </div>
  {% include contact.html %}
</header>
