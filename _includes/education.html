{% assign education = site.data.data.education %}
<section class="section educations-section" aria-labelledby="education-title">
  <h2 class="section-title" id="education-title">{{ education.title | escape }}</h2>
  {% for graduation in education.info %}
  <div class="item">
    <h3 class="degree">{{ graduation.degree | escape }}</h3>
    <p>{{ graduation.university | escape }}, {{ graduation.location | escape }} · {{ graduation.time | escape }}</p>
  </div>
  {% endfor %}
</section>
