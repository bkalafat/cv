{% assign languages = site.data.data.sidebar.languages %}
<section class="section languages-section" aria-labelledby="languages-title">
  <h2 class="section-title" id="languages-title">{{ languages.title | escape }}</h2>
  <ul class="list-unstyled">
    {% for language in languages.info %}
    <li><strong>{{ language.idiom | escape }}:</strong> {{ language.level | escape }}</li>
    {% endfor %}
  </ul>
</section>
