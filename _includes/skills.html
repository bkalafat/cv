{% assign skills = site.data.data.skills %}
<section class="section skills-section" aria-labelledby="skills-title">
  <h2 class="section-title" id="skills-title">{{ skills.title | escape }}</h2>
  <dl class="skill-categories">
    {% for category in skills.categories %}
    <div class="skill-category">
      <dt>{{ category.name | escape }}</dt>
      <dd>{{ category.items | join: ', ' | escape }}</dd>
    </div>
    {% endfor %}
  </dl>
</section>
