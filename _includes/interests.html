{% assign interests = site.data.data.sidebar.interests %}
<section class="section interests-section" aria-labelledby="interests-title">
  <h2 class="section-title" id="interests-title">{{ interests.title | escape }}</h2>
  <p>{% for interest in interests.info %}{{ interest.item | escape }}{% unless forloop.last %}; {% endunless %}{% endfor %}</p>
</section>
